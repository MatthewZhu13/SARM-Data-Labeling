[project]
name = "sarm-pipeline"
version = "0.1.0"
description = "Train SARM2 (stage estimator + reward model) on LeRobot v3.0 datasets and label episodes with stage and progress."
requires-python = ">=3.10"
dependencies = [
  "torch>=2.4",
  "transformers>=4.49,<5",
  "sentencepiece",
  "protobuf",
  "av>=14",
  "numpy",
  "pandas",
  "pyarrow",
  "huggingface_hub>=0.30",
  "pyyaml",
  "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sarm_pipeline*"]
